<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f7f7f9"
    >

    <meta
        name="description"
        content="Visual Sudoku game."
    >

    <title>Visual Sudoku — Game</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main class="app">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="app-header">

            <div class="brand">

                <p class="eyebrow">
                    VISUAL SUDOKU
                </p>

                <h1>
                    <span id="gameThemeName">
                        Numbers
                    </span>
                </h1>

                <p
                    id="gameDifficulty"
                    class="subtitle"
                >
                    Medium
                </p>

            </div>


            <button
                id="exitButton"
                class="exit-button"
                type="button"
            >
                ← Exit
            </button>

        </header>


        <!-- =========================
             GAME INFO
        ========================== -->

        <section class="game-info">

            <div class="timer-box">

                <span class="timer-label">
                    TIME
                </span>

                <strong id="timer">
                    00:00
                </strong>

            </div>


            <div class="game-status">

                <span>
                    Difficulty:
                </span>

                <strong id="difficultyDisplay">
                    Medium
                </strong>

            </div>

            <div class="game-status">

                <span>
                    Score:
                </span>

                <strong id="scoreDisplay">
                    0
                </strong>

            </div>


            <button
                id="darkMode"
                class="mode-button"
                type="button"
                aria-label="Toggle dark mode"
                aria-pressed="false"
            >

                <span
                    id="modeIcon"
                    aria-hidden="true"
                >
                    🌙
                </span>

                <span id="modeText">
                    Dark
                </span>

            </button>

        </section>


        <!-- =========================
             BOARD
        ========================== -->

        <section class="game-area">

            <div
                id="sudokuBoard"
                class="sudoku-board"
                aria-label="Sudoku board"
            ></div>


            <div class="game-actions">

                <button
                    id="hintBtn"
                    class="secondary-button"
                    type="button"
                >
                    <span>💡</span>
                    Hint
                </button>


                <button
                    id="eraseBtn"
                    class="secondary-button"
                    type="button"
                >
                    <span>🧹</span>
                    Erase
                </button>


                <button
                    id="restartBtn"
                    class="secondary-button"
                    type="button"
                >
                    <span>↻</span>
                    Restart
                </button>

            </div>


            <p
                id="message"
                class="message"
                aria-live="polite"
            ></p>

        </section>


        <!-- =========================
             SYMBOL PALETTE
        ========================== -->

        <section
            class="palette-section"
            aria-label="Symbol selection"
        >

            <p class="palette-title">
                Choose a symbol
            </p>


            <div
                id="symbolPalette"
                class="symbol-palette"
            ></div>

        </section>


        <!-- =========================
             WIN MODAL
        ========================== -->

        <div
            id="winModal"
            class="modal hidden"
            role="dialog"
            aria-modal="true"
            aria-labelledby="winTitle"
        >

            <div class="modal-content">

                <div class="win-icon">
                    ✨
                </div>

                <h2 id="winTitle">
                    Puzzle Complete!
                </h2>

                <p>
                    Beautifully solved. 🌸
                </p>

                <p>
                    Time:
                    <strong id="finalTime">
                        00:00
                    </strong>
                </p>

                <p>
                    Level score:
                    <strong id="finalScore">
                        0
                    </strong>
                </p>

                <p id="coinsEarned" class="score-reward">
                    🌱 Coins earned: 0
                </p>


                <button
                    id="nextGameBtn"
                    class="primary-button modal-button"
                    type="button"
                >
                    New Puzzle
                </button>


                <button
                    id="winExitButton"
                    class="secondary-button modal-button"
                    type="button"
                >
                    Main Menu
                </button>

            </div>

        </div>


    </main>


    <script src="js/sudoku.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
    


</body>

</html>
